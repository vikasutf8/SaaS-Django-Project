{% extends "login.html" %}


{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2>Login</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}  <!-- This renders the form fields as paragraphs -->
            <button type="submit" class="btn btn-primary">Register</button>
        </form>
        
        <div class="mt-3">
            <p>Already have an account <a href="{% url 'login' %}">Login</a></p>
        </div>

       
    </div>
</div>
{% endblock content %}
